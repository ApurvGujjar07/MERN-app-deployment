apiVersion: apps/v1
kind: Deployment
metadata:
name: frontend-deployment
namespace: wanderlust
labels:
app: frontend

spec:
replicas: 2   # basic high availability

strategy:
type: RollingUpdate
rollingUpdate:
maxUnavailable: 1
maxSurge: 1

selector:
matchLabels:
app: frontend

template:
metadata:
labels:
app: frontend

```
spec:
  containers:
    - name: frontend
      image: 197103521525.dkr.ecr.ap-south-2.amazonaws.com/frontend:latest
      imagePullPolicy: Always

      ports:
        - containerPort: 80

      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
        limits:
          cpu: "850m"
          memory: "1000Mi"

      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 3

      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 10
        periodSeconds: 10
        failureThreshold: 3
```

