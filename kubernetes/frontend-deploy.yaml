apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: wanderlust
  labels:
    app: frontend

spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: 197103521525.dkr.ecr.ap-south-2.amazonaws.com/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
